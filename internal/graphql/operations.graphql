query CliIdentity {
  cliIdentity {
    keyId
    organizationId
    organizationName
    organizations {
      id
      slug
      name
      plan
      subscriptionStatus
    }
    scopes
    kind
    ownerUserId
    expiresAt
  }
}

mutation CliStartLogin {
  startCliLogin {
    deviceCode
    userCode
    verificationUri
    expiresIn
    interval
  }
}

mutation CliPollLogin($input: CliLoginPollInput!) {
  pollCliLogin(input: $input) {
    status
    apiKey
  }
}

query CliProjects($after: String!, $limit: Int!) {
  projects(where: { id: { _gt: $after } }, order_by: { id: asc }, limit: $limit) {
    id
    name
  }
}

mutation CliCreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    id
    name
  }
}

fragment CliExperimentSummary on experiments {
  id
  name
  projectId: project_id
  kind
  optimization {
    status
    desiredStatus: desired_status
  }
}

query CliExperiments($after: String!, $limit: Int!) {
  experiments(where: { id: { _gt: $after } }, order_by: { id: asc }, limit: $limit) {
    ...CliExperimentSummary
  }
}

query CliProjectExperiments($projectId: String!, $after: String!, $limit: Int!) {
  experiments(
    where: { id: { _gt: $after }, project_id: { _eq: $projectId } }
    order_by: { id: asc }
    limit: $limit
  ) {
    ...CliExperimentSummary
  }
}

query CliValidateConfiguration($input: CliConfigurationInput!) {
  validateCliConfiguration(input: $input) {
    configuration
    warnings
  }
}

mutation CliCreateRegistryCredentials {
  createCliRegistryCredentials {
    registryHost
    projectName
    username
    password
    expiresAt
  }
}

mutation CliLaunch($input: ManagedExperimentCreateInput!) {
  createManagedExperiment(input: $input) {
    id
    projectId
    name
    dashboardUrl
  }
}

mutation CliStop($input: ExperimentCommandInput!) {
  stopExperiment(input: $input) {
    id
    desiredStatus
    success
  }
}

query CliExperiment($projectId: String!, $id: String!) {
  experiments(
    where: {
      id: { _eq: $id }
      project_id: { _eq: $projectId }
      kind: { _eq: "managed_optimization" }
    }
    limit: 1
  ) {
    id
    name
    optimization {
      status
      desiredStatus: desired_status
      maxTrialCount: max_trial_count
    }
    metrics(where: { objective_order: { _is_null: false } }, order_by: { objective_order: asc }) {
      key
    }
  }
}

query CliRuns(
  $projectId: String!
  $experimentId: String!
  $after: String!
  $limit: Int!
  $metricKeys: [String!]!
) {
  runs(
    where: {
      project_id: { _eq: $projectId }
      experiment_id: { _eq: $experimentId }
      id: { _gt: $after }
    }
    order_by: { id: asc }
    limit: $limit
  ) {
    id
    status
    finalizationState: finalization_state
    startedAt: started_at
    finishedAt: finished_at
    optimization {
      number
      resultsAcceptedAt: results_accepted_at
    }
    finalMetrics: final_metrics(where: { key: { _in: $metricKeys } }) {
      key
      value
    }
    metrics(where: { kind: { _eq: "scalar" }, key: { _in: $metricKeys } }) {
      key
      aggregation
      lastValue: last_value
      minValue: min_value
      maxValue: max_value
      meanValue: mean_value
      explicitValue: explicit_value
    }
  }
}

mutation CliPause($input: ExperimentCommandInput!) {
  pauseExperiment(input: $input) { id desiredStatus success }
}
mutation CliResume($input: ExperimentCommandInput!) {
  resumeExperiment(input: $input) { id desiredStatus success }
}

query CliExperimentDetails($where: experiments_bool_exp!) {
  experiments(where: $where, limit: 1) {
    id name kind projectId: project_id description createdAt: created_at
    optimization {
      status desiredStatus: desired_status maxTrialCount: max_trial_count
      parallelTrialCount: parallel_trial_count dockerImage: docker_image algorithm commandTemplate: command_template
    }
    parameters(order_by: {key: asc}) { key kind minValue: min_value maxValue: max_value stepValue: step_value logarithmic choices }
    metrics(where: {objective_order: {_is_null: false}}, order_by: {objective_order: asc}) {
      key direction
    }
  }
}

fragment CliRunDetails on runs {
  id name projectId: project_id experimentId: experiment_id status
  finalizationState: finalization_state createdAt: created_at startedAt: started_at
  finishedAt: finished_at finalizedAt: finalized_at lastError: last_error
  optimization { number resultsAcceptedAt: results_accepted_at }
  parameters(order_by: {key: asc}) { key numberValue: number_value stringValue: string_value booleanValue: boolean_value }
  finalMetrics: final_metrics { key value }
  metrics {
    key aggregation lastValue: last_value minValue: min_value maxValue: max_value
    meanValue: mean_value explicitValue: explicit_value
  }
}
query CliRunDetailsPage($where: runs_bool_exp!, $limit: Int!) {
  runs(where: $where, order_by: {id: asc}, limit: $limit) { ...CliRunDetails }
}

query CliLogs($input: LogsInput!) {
  logs(input: $input) {
    windowEnd totalHits
    hits { timestamp message level podName namespace container trialId experimentId orgId }
  }
}
