name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go generate ./internal/graphql
      - run: git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and independently repeat packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          sh package.sh "${RELEASE_TAG#v}"
          cp dist/checksums.txt "$RUNNER_TEMP/first-checksums.txt"
          rm -rf dist
          go clean -cache
          sh package.sh "${RELEASE_TAG#v}"
          cmp "$RUNNER_TEMP/first-checksums.txt" dist/checksums.txt
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/*'
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "HPO $RELEASE_TAG" --notes-file RELEASE_NOTES.md
