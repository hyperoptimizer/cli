name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Read GoReleaser version
        id: goreleaser-version
        shell: bash
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v${{ steps.goreleaser-version.outputs.version }}
          install-only: true
      - run: goreleaser check
      - run: go mod verify
      - run: go generate ./internal/graphql
      - run: git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and independently repeat packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          sh package.sh "${RELEASE_TAG#v}"
          cp dist/release/checksums.txt "$RUNNER_TEMP/first-checksums.txt"
          rm -rf dist
          go clean -cache
          sh package.sh "${RELEASE_TAG#v}"
          cmp "$RUNNER_TEMP/first-checksums.txt" dist/release/checksums.txt
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/release/*'
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/release/* --draft --verify-tag --title "HPO $RELEASE_TAG" --notes-file RELEASE_NOTES.md "${prerelease[@]}"
