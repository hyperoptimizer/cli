name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go generate ./internal/graphql
      - run: git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Compare two clean builds of every release archive
        shell: bash
        run: |
          sh package.sh 0.0.0-repro
          cp dist/checksums.txt "$RUNNER_TEMP/first-checksums.txt"
          rm -rf dist
          go clean -cache
          sh package.sh 0.0.0-repro
          cmp "$RUNNER_TEMP/first-checksums.txt" dist/checksums.txt
